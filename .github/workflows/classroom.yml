name: Build, test and deploy

on:
  push:
    branches: [ lab1 ]
  pull_request:
    branches: [ lab1 ]

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Сборка Docker-образа
      # По умолчанию ищется Dockerfile и дополнительно присваивается метка web
      - name: Build the Docker image
        run: docker build -t web .

      # Прогон unit-тестов
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: |
          go vet ./...
          go test ./... -v -cover

      # Деплой на Render через API (только push; на PR секретов нет).
      # Именно API, а не deploy hook: hook лишь запускает деплой, а статус
      # достать негде — health-check успевает получить 200 от СТАРОГО
      # инстанса, пока новый собирается, и интеграционные тесты уходят
      # не на тот код (гонка). Здесь деплой создаётся явно и его id
      # сохраняется в $deploy_id для следующего шага.
      - name: Deploy to Render
        if: github.event_name == 'push'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::Не заданы секреты RENDER_API_KEY / RENDER_SERVICE_ID (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          resp=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -d '{"branch":"lab1"}')
          echo "$resp"
          echo "deploy_id=$(echo "$resp" | jq -r '.deploy.id')" >> "$GITHUB_ENV"

      # Ждём именно статус деплоя: live = новый код собран, прошёл
      # health-check и принимает трафик. Остальные статусы — ошибка.
      - name: Wait for the deploy to finish
        if: github.event_name == 'push'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          for i in $(seq 1 90); do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              | jq -r '.deploy.status // "unknown"')
            echo "attempt $i: deploy status = $status"
            case "$status" in
              live)
                echo "deploy is live"
                exit 0 ;;
              build_failed|canceled|deleted|deactivated)
                echo "::error::Деплой завершился со статусом $status"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Деплой не завершился за 15 минут"
          exit 1

      # Страховка: сервис реально отвечает 200 на health-check
      - name: Wait for the service to become ready
        if: github.event_name == 'push'
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::Не задан секрет RENDER_BASE_URL"
            exit 1
          fi
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/v1/persons" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "service is ready"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Сервис не ответил за 5 минут"
          exit 1

      - name: Set up Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run integration tests (Newman)
        if: github.event_name == 'push'
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          npx newman run "postman/[inst] Lab1.postman_collection.json" \
            -e "postman/[inst][local] Lab1.postman_environment.json" \
            --env-var baseUrl="$BASE_URL"
